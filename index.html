<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokédex completa com PokéAPI - explore, busque, compare e favorite todos os Pokémon.">
    <title>Pokédex</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23fff%22 stroke=%22%23333%22 stroke-width=%226%22/><path d=%22M5 50h90%22 stroke=%22%23333%22 stroke-width=%226%22/><path d=%22M5 50a45 45 0 0 1 90 0%22 fill=%22%23ef4444%22/><circle cx=%2250%22 cy=%2250%22 r=%2214%22 fill=%22%23fff%22 stroke=%22%23333%22 stroke-width=%226%22/></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('pokedex_theme') || 'light';
    </script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo">
                <svg class="logo-ball" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2a10 10 0 0 1 10 10h-3.6A6.4 6.4 0 0 0 12 5.6 6.4 6.4 0 0 0 5.6 12H2A10 10 0 0 1 12 2z" fill="var(--accent)"/>
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M2 12h20" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="3.2" fill="var(--surface)" stroke="currentColor" stroke-width="2"/>
                </svg>
                Pokédex
            </h1>
            <nav class="nav">
                <button class="nav-btn active" data-view="all">Todos</button>
                <button class="nav-btn" data-view="favorites">Favoritos</button>
                <button class="nav-btn" data-view="compare">Comparar</button>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema claro e escuro">
                <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="main">
        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Buscar Pokémon..."
                    autocomplete="off"
                >
                <button class="search-btn" id="searchBtn" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="m20 20-3.5-3.5"/>
                    </svg>
                </button>
            </div>
            
            <div class="filters">
                <select id="typeFilter" class="filter-select">
                    <option value="">Todos os Tipos</option>
                    <option value="normal">Normal</option>
                    <option value="fire">Fogo</option>
                    <option value="water">Água</option>
                    <option value="electric">Elétrico</option>
                    <option value="grass">Planta</option>
                    <option value="ice">Gelo</option>
                    <option value="fighting">Luta</option>
                    <option value="poison">Venenoso</option>
                    <option value="ground">Terra</option>
                    <option value="flying">Voador</option>
                    <option value="psychic">Psíquico</option>
                    <option value="bug">Inseto</option>
                    <option value="rock">Pedra</option>
                    <option value="ghost">Fantasma</option>
                    <option value="dragon">Dragão</option>
                    <option value="dark">Sombrio</option>
                    <option value="steel">Aço</option>
                    <option value="fairy">Fada</option>
                </select>
                
                <select id="generationFilter" class="filter-select">
                    <option value="">Todas as Gerações</option>
                    <option value="1">1ª Geração</option>
                    <option value="2">2ª Geração</option>
                    <option value="3">3ª Geração</option>
                    <option value="4">4ª Geração</option>
                    <option value="5">5ª Geração</option>
                    <option value="6">6ª Geração</option>
                    <option value="7">7ª Geração</option>
                    <option value="8">8ª Geração</option>
                    <option value="9">9ª Geração</option>
                </select>
                
                <button class="filter-btn" id="clearFilters">Limpar Filtros</button>
            </div>
        </section>

        <section class="stats-bar" id="statsBar">
            <div class="stat">
                <span class="stat-value" id="totalPokemon">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="displayedPokemon">0</span>
                <span class="stat-label">Exibidos</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="favoritesCount">0</span>
                <span class="stat-label">Favoritos</span>
            </div>
        </section>

        <section class="pokemon-grid" id="pokemonGrid">
        </section>

        <section class="compare-section hidden" id="compareSection">
            <h2>Comparar Pokémon</h2>
            <div class="compare-container">
                <div class="compare-slot" id="compareSlot1">
                    <p>Selecione o primeiro Pokémon</p>
                </div>
                <div class="compare-vs">VS</div>
                <div class="compare-slot" id="compareSlot2">
                    <p>Selecione o segundo Pokémon</p>
                </div>
            </div>
            <button class="compare-btn" id="compareBtn" disabled>Comparar</button>
            <button class="filter-btn compare-reset" id="compareReset">Limpar Comparação</button>
        </section>

        <div class="pagination" id="pagination">
            <button class="page-btn" id="prevPage" disabled>← Anterior</button>
            <span class="page-info" id="pageInfo">1 / 1</span>
            <button class="page-btn" id="nextPage">Próximo →</button>
        </div>
    </main>

    <div class="modal hidden" id="pokemonModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <footer class="footer">
        <p>Pokédex — dados fornecidos pela <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
